<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a test | Anjana Scans &amp; Diagnostics, Madanapalle</title>
<meta name="theme-color" content="#04acec">
<style>
:root{--blue:#04acec;--blue-d:#0390cf;--pink:#e91391;--navy:#202044;--indigo:#2d378e;--tint:#f3f3fd;--line:#dedeeb;--muted:#5f6880;--page:#f4f7fc;--danger:#b3261e;--ok:#12805c;--gold:#ffe94d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eaf6fd 0,var(--page) 220px,var(--page));background-attachment:fixed;color:var(--navy);line-height:1.5;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.hdr{background:#fff;border-bottom:5px solid var(--blue);position:sticky;top:0;z-index:20}
.hdr-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;color:var(--navy);flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo img{height:38px;width:auto;display:block;max-width:100%}
.logo b{font-size:16px;line-height:1.15;font-weight:800;letter-spacing:.01em}
.logo small{display:block;font-weight:600;color:var(--pink);font-size:12px}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--blue);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--blue-d);text-decoration:none;cursor:pointer;white-space:nowrap}
.hbtn.fill{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.hbtn svg{width:16px;height:16px}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.band{background:var(--pink);color:#fff;border-radius:10px;padding:10px 14px;text-align:center;margin:0 0 14px;border-bottom:4px solid var(--blue)}
.band b{display:block;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.band small{font-size:12.5px;opacity:.95}
h1{font-size:24px;line-height:1.25;margin:4px 0 6px}
h2{font-size:17px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.num{width:26px;height:26px;border-radius:50%;background:var(--pink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sec h2{margin:0}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile{text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}
.tile:hover{border-color:var(--blue)}
.tile .ti{width:46px;height:46px;border-radius:12px;background:#e4f5fd;color:var(--blue-d);display:flex;align-items:center;justify-content:center;flex:none}
.tile .ti svg{width:24px;height:24px}
.tile .ti .tic{width:30px;height:30px;display:block}
.tile.hc .ti{background:#fde7f3}
.tile b{display:block;font-size:17px}
.tile span{color:var(--muted);font-size:14px}
.tile .go{margin-left:auto;color:var(--muted)}
.tile.wa{background:linear-gradient(135deg,var(--blue-d),#1b5fb8);color:#fff;border:0}
.tile.wa .ti{background:rgba(255,255,255,.18);color:#fff}
.tile.wa span,.tile.wa .go{color:#e4f5fd}
.tile.hc{border-color:var(--pink)}
.tile.hc .ti{background:#fde6f3;color:var(--pink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.tab{border:1.5px solid var(--blue);background:#fff;border-radius:12px;padding:9px 6px;font-size:13.5px;font-weight:700;color:var(--blue-d);cursor:pointer;line-height:1.2;min-height:48px}
.tab small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.wg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(32,32,68,.04)}
.nm{margin:0;font-size:20px;line-height:1.2;font-weight:800;background:linear-gradient(90deg,var(--blue-d),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sb{color:var(--muted);font-size:13px;margin:2px 0 0;font-weight:600}
.ts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px;font-size:14.5px}
.ts li{display:flex;gap:8px;align-items:flex-start}
.ts svg{width:16px;height:16px;margin-top:3px;color:var(--blue-d);stroke-width:2.4}
.more{background:none;border:0;color:var(--pink);font-weight:700;font-size:14px;padding:8px 0 0;cursor:pointer}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pb{background:var(--blue-d);color:#fff;border-radius:10px;padding:7px 14px;display:flex;align-items:baseline;gap:10px}
.pb s{color:var(--gold);font-size:14px;font-weight:600;text-decoration-thickness:2px}
.pb b{font-size:22px;line-height:1}
.bn{border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:800;padding:12px 24px;font-size:15.5px;cursor:pointer}
.bn:hover{filter:brightness(.95)}
.pk-sum{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--pink);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.pk-sum b{display:block}
.pk-sum small{color:var(--muted)}
.pk-sum .pr{font-weight:800;color:var(--blue-d);white-space:nowrap}
label.f{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
select,input[type=text],input[type=tel],input[type=number],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700}
.opt.on{border-color:var(--pink);background:#fff3fa}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.info{display:grid;gap:8px;margin-top:12px;font-size:14px;color:var(--navy)}
.info div{display:flex;gap:10px;align-items:flex-start}
.info svg{margin-top:2px;color:var(--blue-d)}
.info a{color:var(--blue-d);font-weight:700}
.notice{display:flex;gap:10px;align-items:flex-start;background:#fff7e6;border:1px solid #f0d9a8;color:#6b4a00;border-radius:12px;padding:11px 12px;font-size:14px;margin-top:12px}
.notice svg{margin-top:2px}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.date{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer}
.date small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.date b{display:block;font-size:20px;line-height:1.2}
.date span{font-size:12px;color:var(--muted)}
.date.on{border-color:var(--pink);background:#fff3fa}
.date.on small,.date.on span{color:var(--pink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:14px}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;text-align:center;font-size:14px;font-weight:600;cursor:pointer}
.slot.on{background:var(--pink);border-color:var(--pink);color:#fff}
.slot[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:15}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.bar .sum b{color:var(--navy);font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:800;padding:13px 26px;font-size:16px;cursor:pointer}
.btn[disabled]{background:#c9cbd8;cursor:not-allowed}
.btn.blue{background:var(--blue-d)}
.btn.line{background:#fff;color:var(--blue-d);border:1.5px solid var(--blue-d)}
.btn.block{width:100%}
.btn.sm{padding:8px 16px;font-size:14px}
.err{color:var(--danger);font-size:14px;margin:10px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.center{max-width:420px;margin:24px auto 0}
.otp{letter-spacing:.5em;text-align:center;font-size:24px;font-weight:700}
.link{background:none;border:0;color:var(--blue-d);font-weight:700;cursor:pointer;padding:6px 0;font-size:14px;text-decoration:underline}
.link.red{color:var(--danger)}
.ok{width:56px;height:56px;border-radius:50%;background:#e6f5ef;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.ok svg{width:30px;height:30px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:8px 12px;font-size:15px;margin:14px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.pt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.pt.on{border-color:var(--pink);background:#fff3fa}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;position:relative;background:#fff}
.on>.radio{border-color:var(--pink)}
.on>.radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--pink)}
.pt .body{flex:1}
.pt small{color:var(--muted);display:block}
.pt .acts{display:flex;gap:12px}
.bk{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;margin-bottom:10px}
.bk .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bk .t{font-weight:700}
.bk .m{color:var(--muted);font-size:14px}
.bk .act{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.bk select{width:auto;padding:7px 10px;font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#e4f5fd;color:var(--blue-d)}
.pill.off{background:#eceef4;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}
.atabs{display:flex;gap:8px;margin:0 0 14px}
.atab{border:1.5px solid var(--blue);background:#fff;border-radius:999px;padding:8px 18px;font-weight:700;color:var(--blue-d);cursor:pointer}
.atab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:10px 0}
.chk input{width:20px;height:20px}
.mini{font-size:13px;color:var(--muted);text-align:center;margin-top:20px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}

.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px 6px;padding:2px 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.col{display:flex;flex-direction:column;gap:14px;margin-bottom:10px}
.col .rc{flex:none;width:100%}
.hbtn.adm{border-color:var(--pink);color:var(--pink)}
.rc{flex:0 0 min(84vw,330px);scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(32,32,68,.05)}
.rc.hl{outline:3px solid var(--blue);outline-offset:-1px}
.rc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.tag{background:#fde6f3;color:var(--pink);font-weight:700;font-size:12.5px;border-radius:8px;padding:3px 10px}
.shr{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--blue-d);background:transparent;color:var(--blue-d);border-radius:10px;padding:5px 11px;font-size:13.5px;font-weight:700;cursor:pointer}
.shr svg{width:16px;height:16px}
.rc .ts{flex:1}
.rc .ft{flex-direction:column;align-items:stretch;gap:12px}
.rc .pb{align-self:flex-start}
.prices{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mp{border:1.5px dashed var(--pink);border-radius:10px;padding:3px 10px;line-height:1.1;color:var(--navy);background:#fff}
.mp small{display:block;font-size:10.5px;font-weight:700;color:var(--pink);letter-spacing:.02em}
.mp b{font-size:16px}
.rc.prem .mp,.mc.prem .mp{background:rgba(255,255,255,.12);border-color:var(--gold);color:#fff}
.rc.prem .mp small,.mc.prem .mp small{color:var(--gold)}
.mc .mp{padding:2px 7px}.mc .mp b{font-size:14px}.mc .mp small{font-size:9.5px}
.mc .prices{flex-direction:column;align-items:flex-start;gap:3px}
.mc .mp{border:0;background:none;padding:0;display:flex;gap:5px;align-items:baseline}
.mc .mp small{font-size:11px}.mc .mp b{font-size:13px}
.mc.prem .mp{background:none}
.rc .bn{width:100%;border-radius:12px}
.rc.prem{background:linear-gradient(165deg,var(--navy),var(--indigo));border-color:var(--navy);color:#fff}
.rc.prem .tag{background:var(--gold);color:var(--navy)}
.rc.prem .nm{background:none;color:#fff;-webkit-text-fill-color:#fff}
.rc.prem .sb{color:#c9cdf0}
.rc.prem .ts svg{color:var(--gold)}
.rc.prem .more{color:var(--gold)}
.rc.prem .ft{border-top-color:rgba(255,255,255,.2)}
.rc.prem .shr{color:#fff;border-color:rgba(255,255,255,.6)}
.rc.prem .pb{background:var(--pink)}
.rc.prem .bn{background:#fff;color:var(--pink)}
.rh{display:flex;align-items:center;gap:10px;margin:6px 0 10px;font-size:19px;font-weight:800}
.rh .bd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fde6f3;color:var(--pink)}
.rh.gold .bd{background:var(--navy);color:var(--gold)}
.rh .ln{flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,#f7c3e2,transparent)}
.rh.gold .ln{background:linear-gradient(90deg,#c9cdf0,transparent)}
.rh svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:9px 18px;font-size:14px;z-index:30}

main.home{padding-bottom:12px}
.home .band{padding:7px 12px;margin-bottom:10px}
.home .band b{font-size:15px}
.home .band small{font-size:12px}
.home .tile{padding:10px 14px;margin-bottom:9px;gap:12px;border-radius:14px}
.home .tile .ti{width:40px;height:40px}
.home .tile b{font-size:min(15px,3.7vw)}
.home .tile.dg b{white-space:nowrap}
.home .tile{gap:9px}
.home .tile .go svg{width:18px;height:18px}
.home .tile span{font-size:13px}
.home .rh{margin:10px 0 6px;font-size:16px}
.home .rh .bd{width:24px;height:24px}
.home .rail{margin-bottom:0;padding-bottom:4px}
.mc{flex:0 0 min(68vw,250px);scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mc.prem{background:linear-gradient(165deg,var(--navy),var(--indigo));border-color:var(--navy);color:#fff}
.mc .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mc .tag{font-size:11.5px;padding:2px 8px}
.mc.prem .tag{background:var(--gold);color:var(--navy)}
.mc .shr{padding:3px 8px;font-size:12px;border-radius:8px}
.mc .shr svg{width:14px;height:14px}
.mc.prem .shr{color:#fff;border-color:rgba(255,255,255,.6)}
.mc .mn{font-size:15px;font-weight:800;line-height:1.2;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.mc .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc .pb{padding:4px 10px}
.mc .pb b{font-size:17px}.mc .pb s{font-size:12px}
.mc.prem .pb{background:var(--pink)}
.mc .bn{padding:8px 14px;font-size:14px;white-space:nowrap}
.mc.prem .bn{background:#fff;color:var(--pink)}
.mc{min-width:0;overflow:hidden}.mc .mt{min-width:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.mc .mt li{font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px;position:relative;color:#5b6078}
.mc .mt li:before{content:"";position:absolute;left:2px;top:.45em;width:6px;height:6px;border-radius:50%;background:var(--pink)}
.mc.prem .mt li{color:#dfe3ff}.mc.prem .mt li:before{background:var(--gold)}
/* v7 home, prices, categories */
.pb{background:none;color:var(--navy);padding:0;border-radius:0;display:flex;align-items:baseline;gap:8px}
.pb s{color:#8a90a8;font-size:15px;font-weight:600;text-decoration-thickness:1.5px}
.pb b{font-size:24px;line-height:1;color:var(--navy)}
.rc.prem .pb,.mc.prem .pb{background:none}.rc.prem .pb b,.mc.prem .pb b{color:#fff}.rc.prem .pb s,.mc.prem .pb s{color:#b9bfe6}
.mp,.mc .mp{border:1.5px solid var(--pink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}.tabs .tab{flex:1 1 calc(33.3% - 8px);min-width:96px}
.tab.add{border-style:dashed;border-color:var(--pink);color:var(--pink);flex:0 0 auto;min-width:80px}
main.home{height:calc(100dvh - var(--hh,71px));box-sizing:border-box;display:flex;flex-direction:column;padding:10px 16px;overflow:hidden}
.home .band{padding:8px 12px;margin-bottom:10px;flex:0 0 auto}
.home .tile{padding:11px 14px;margin-bottom:9px;flex:0 0 auto}
.home .rh{margin:6px 0 6px;flex:0 0 auto}
.home .rail{flex:1 1 auto;min-height:0;max-height:440px;align-items:stretch;margin:0 -16px;padding:2px 16px 6px}
.mc{flex:0 0 min(80vw,300px);padding:12px 14px;gap:8px;min-height:0;overflow:hidden}
.mc .mn{min-height:0}
.mc .mt{flex:1 1 auto;min-height:0;overflow:hidden}
.mc .mt li{font-size:14px}
.mc .prices{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}
.mc .mp{background:#fff;padding:2px 8px;display:block;border-radius:10px}
.mc .mp small{display:block;font-size:9.5px}.mc .mp b{font-size:14px}
.mc.prem .mp{background:rgba(255,255,255,.12);border-color:var(--gold)}
.mc .bn{width:100%;border-radius:12px;padding:10px 14px;font-size:15px;white-space:nowrap}
.dots{display:flex;justify-content:center;margin:0 0 8px;flex:0 0 auto;min-height:20px}
.dots .pill{display:inline-flex;gap:8px;align-items:center;background:#dfe5f3;border-radius:999px;padding:6px 12px}
.dots button{width:8px;height:8px;border-radius:50%;background:#a9b2cf;border:0;padding:0;cursor:pointer}
.dots button.on{background:var(--pink)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;background:#e4f1f1;border-radius:14px;padding:8px 6px;flex:0 0 auto}
.trust div{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;text-align:center}
.trust img{height:34px;width:auto;max-width:90%;object-fit:contain}
.trust b{font-size:11.5px;line-height:1.2;color:var(--navy)}
.home .tile>div:nth-child(2){min-width:0}.home .tile span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media (max-width:400px){.home .tile span{font-size:12px}}
.mc>*{flex-shrink:0}.mc>.mt{flex-shrink:1}.mc .mt li{flex-shrink:0}
/* v8 compact home: natural height, no stretching */
main.home{height:auto;min-height:0;display:block;overflow:visible;padding:10px 16px 16px}
.home .band{padding:8px 12px;margin:0 0 10px;border-bottom-width:3px}
.home .band b{font-size:15px}.home .band small{font-size:12px}
.home .tile{padding:9px 12px;margin-bottom:8px;gap:10px;border-radius:14px}
.home .tile .ti{width:38px;height:38px;border-radius:10px}
.home .tile .ti .tic{width:26px;height:26px}
.home .tile b{font-size:15px;line-height:1.25}.home .tile span{font-size:12.5px;line-height:1.3}
.home .rh{margin:8px 0 6px}
.home .rail{flex:none;max-height:none;align-items:flex-start;margin:0 -16px;padding:2px 16px 6px}
.mc{flex:0 0 min(76vw,270px);padding:10px 12px;gap:6px;overflow:hidden}
.mc .mn{font-size:14.5px;-webkit-line-clamp:1;min-height:0}
.mc .mt{flex:none;gap:2px}.mc .mt li{font-size:13px;line-height:1.3}
.mc .pb b{font-size:20px}.mc .pb s{font-size:13px}
.mc .tag{font-size:11px;padding:2px 8px}.mc .shr{padding:2px 8px;font-size:11.5px}
.mc .bn{padding:8px 12px;font-size:14px;border-radius:10px}
.dots{margin:2px 0 10px;min-height:0}.dots .pill{padding:5px 10px}
.trust{margin-top:0;padding:8px 6px}.trust img{height:28px}.trust b{font-size:11px}
@media (max-height:700px){.mc .mt li:nth-child(n+4){display:none}.home .tile{padding:6px 12px;margin-bottom:6px}.home .band{padding:6px 12px;margin-bottom:8px}.home .band small{display:none}.home .tile span{font-size:12px}.trust img{height:22px}.trust b{font-size:10px}}

.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--blue-d);font-weight:700;font-size:15px;padding:4px 6px 4px 0;margin:0 0 6px;cursor:pointer}.back svg{width:20px;height:20px}
.dtabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.dtab{border:1.5px solid var(--blue);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--blue-d);cursor:pointer;white-space:nowrap}
.dtab small{font-weight:600;opacity:.85;margin-left:4px}
.dtab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.dtab.add{border-style:dashed;border-color:var(--pink);color:var(--pink)}
.srch{position:relative;margin:0 0 10px}.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.srch input{width:100%;padding:13px 14px 13px 42px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.types{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.types .chip{padding:5px 11px;font-size:13px}
.trow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.trow .tn{flex:1;min-width:0}.trow .tn b{display:block;font-size:15px;line-height:1.25}.trow .tn small{color:var(--muted);font-size:12.5px}
.trow .tp{font-weight:800;color:var(--navy);white-space:nowrap}
.trow.on{border-color:var(--pink);background:#fff7fb}
.tadd{border:1.5px solid var(--pink);background:#fff;color:var(--pink);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.tadd.on{background:var(--pink);color:#fff}
.tot{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;padding:14px 4px;border-top:2px solid var(--line);margin-top:4px}
.atabs{flex-wrap:wrap}.atab{padding:8px 14px}
@media (max-width:420px){.logo b{font-size:14px}.hbtn{padding:7px 10px;font-size:13px}.slots{grid-template-columns:repeat(3,1fr)}.nm{font-size:18px}.bn{padding:11px 18px}}
</style>

function dTests() {
  var q = S.dq.trim().toLowerCase();
  return S.tests.filter(function (x) { return x.category === S.dcat && (!S.dtype || x.type === S.dtype) && (!q || (x.name + ' ' + (x.type || '')).toLowerCase().indexOf(q) >= 0); });
}
function drawDlist() {
  var el = $('dlist'); if (!el) return;
  var list = dTests(), c = catById(S.dcat), total = S.tests.filter(function (x) { return x.category === S.dcat; }).length;
  var cnt = $('dcount'); if (cnt) cnt.textContent = (S.dq.trim() || S.dtype) ? list.length + ' of ' + total + ' tests shown' : total + ' tests available';
  if (!list.length) { el.innerHTML = '<p class="hint" style="text-align:center;margin:24px 0">No ' + esc(c ? c.name : '') + ' tests match "' + esc(S.dq) + '". Try another word, or message us on WhatsApp.</p>'; return; }
  el.innerHTML = list.map(function (x) {
    var on = S.basket.indexOf(x.id) >= 0;
    return '<div class="trow' + (on ? ' on' : '') + '"><div class="tn"><b>' + esc(x.name) + '</b>' + (x.type ? '<small>' + esc(x.type) + '</small>' : '') + '</div><div class="tp">' + money(x.price) + '</div><button class="tadd' + (on ? ' on' : '') + '" data-act="tbasket" data-id="' + esc(x.id) + '">' + (on ? 'Added' : 'Add') + '</button></div>';
  }).join('');
}
function basketBar(label, act, btn) {
  var n = S.basket.length; if (!n) return '';
  return '<div class="bar"><div class="bar-in"><div class="sum"><b>' + n + ' test' + (n > 1 ? 's' : '') + ' selected</b>' + money(basketTotal()) + '</div><button class="btn" data-act="' + act + '">' + btn + '</button></div></div>';
}
function viewScans() {
  if (!S.dcat || !catById(S.dcat)) { S.dcat = S.cats.length ? S.cats[0].id : ''; S.dtype = ''; S.dq = ''; }
  var c = catById(S.dcat);
  var h = '<div class="band"><b>Diagnostics</b><small>Choose a category, search and add tests to your basket</small></div><div class="dtabs">';
  S.cats.forEach(function (k) {
    var n = S.tests.filter(function (x) { return x.category === k.id; }).length;
    h += '<button class="dtab' + (k.id === S.dcat ? ' on' : '') + '" data-act="dcat" data-id="' + esc(k.id) + '">' + esc(k.name) + '<small>' + n + '</small></button>';
  });
  if (S.admin) h += '<button class="dtab add" data-act="adddiagcat">+ Add</button>';
  h += '</div>';
  if (!c) { $('app').innerHTML = h + '<p class="hint">No tests are available yet. Please message us on WhatsApp.</p>'; return ''; }
  var types = []; S.tests.forEach(function (x) { if (x.category === S.dcat && x.type && types.indexOf(x.type) < 0) types.push(x.type); });
  h += '<div class="srch">' + ic('search') + '<input id="dq" type="search" autocomplete="off" placeholder="Search ' + esc(c.name) + ' tests" data-in="dq" value="' + esc(S.dq) + '"></div>';
  if (types.length) h += '<div class="types"><button class="chip' + (!S.dtype ? ' on' : '') + '" data-act="dtype" data-t="">All types</button>' + types.map(function (ty) { return '<button class="chip' + (S.dtype === ty ? ' on' : '') + '" data-act="dtype" data-t="' + esc(ty) + '">' + esc(ty) + '</button>'; }).join('') + '</div>';
  h += '<p class="hint" id="dcount" style="margin:0 0 10px"></p><div id="dlist"></div>';
  $('app').innerHTML = h; drawDlist();
  return basketBar('', 'basket', 'View basket');
}
function viewBasket() {
  var it = basketItems();
  var h = '<h1>Your basket</h1><p class="sub">Review your tests, then tap Book Now.</p>';
  if (!it.length) return $('app').innerHTML = h + '<section class="card" style="text-align:center"><p class="sub">Your basket is empty.</p><button class="btn blue" data-act="scans">Choose tests</button></section>', '';
  it.forEach(function (x) {
    var c = catById(x.category);
    h += '<div class="trow on"><div class="tn"><b>' + esc(x.name) + '</b><small>' + esc((c ? c.name : '') + (x.type ? ' / ' + x.type : '')) + '</small></div><div class="tp">' + money(x.price) + '</div><button class="tadd on" data-act="tremove" data-id="' + esc(x.id) + '">Remove</button></div>';
  });
  h += '<div class="tot"><span>Total (' + it.length + ' test' + (it.length > 1 ? 's' : '') + ')</span><span>' + money(basketTotal()) + '</span></div>' +
    '<button class="btn line block" data-act="scans" style="margin-top:6px">+ Add more tests</button>';
  $('app').innerHTML = h;
  return '<div class="bar"><div class="bar-in"><div class="sum"><b>' + money(basketTotal()) + '</b>' + it.length + ' test' + (it.length > 1 ? 's' : '') + '</div><button class="btn" data-act="bookbasket">Book Now</button></div></div>';
}

function memberTag(p) { return p.member > 0 && p.member < p.price ? '<div class="mp"><small>Member price</small><b>' + money(p.member) + '</b></div>' : ''; }
function pkgCard(p, k) {
  var open = !!S.open[p.id], shown = open ? p.tests : p.tests.slice(0, 4);
  return '<article class="rc' + (p.premium ? ' prem' : '') + (S.focus === p.id ? ' hl' : '') + '" id="pk-' + esc(p.id) + '"><div class="top"><span class="tag">' + esc(p.subtitle || (p.tests.length + ' tests')) + '</span>' +
    '<button class="shr" data-act="share" data-id="' + esc(p.id) + '">' + ic('share') + 'Share</button></div>' +
    '<h3 class="nm">' + esc(p.name) + '</h3>' +

/* ---------- actions ---------- */
function logout() { S.pkgId = ''; S.token = ''; S.role = ''; S.admin = false; S.staff = false; S.phone = ''; S.patients = []; S.patientId = ''; S.delArm = ''; store('ad_session', null); }
function saveSession() { store('ad_session', JSON.stringify({ token: S.token, role: S.role, admin: S.admin, staff: S.staff, phone: S.phone })); }
function refreshSlots() {
  var loc = curLoc();
  if (!loc || !S.sel.date) { S.full = []; return Promise.resolve(); }
  return api('slots', { date: S.sel.date, locationId: loc.id, visit: S.sel.visit }).then(function (r) { S.full = r.full || []; if (S.full.indexOf(S.sel.time) >= 0) S.sel.time = ''; }).catch(function () { S.full = []; });
}
function refresh() { refreshSlots().then(function () { rerender(true); }); rerender(true); }
function afterLogin() {
  if ((S.admin || S.staff) && !S.pkgId) { if (!S.admin) S.adminTab = 'bookings'; return go('admin'); }
  if (S.pkgId) return go('patient');
  go('health');
}
function startPatientStep() {
  if (S.patients.length && !curPatient()) S.patientId = S.patients.length === 1 ? S.patients[0].id : '';
  go('patient');
}
function confirmBooking() {
  var s = S.sel;
  S.busy = true; S.err = ''; rerender(true);
  api('book', { packageId: S.pkgId, testIds: S.pkgId === '__basket' ? S.basket : undefined, patientId: S.patientId, locationId: s.loc, visit: s.visit, date: s.date, time: s.time, address: s.address }).then(function (r) {
    S.busy = false; S.last = r.booking; s.time = ''; if (S.pkgId === '__basket') { S.basket = []; saveBasket(); S.pkgId = ''; } go('done');
  }).catch(function (e) {
    S.busy = false;
    if (e.code === 'auth') { logout(); S.login = { step: 'phone', role: 'patient', phone: '', busy: false, err: 'Please log in again to finish your booking.' }; return go('login'); }
    S.err = e.message; if (/^slot_|date_closed/.test(e.code || '')) s.time = '';
    refresh();
  });
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  var a = el.getAttribute('data-act'), sel = S.sel, id = el.getAttribute('data-id');
  if (el.disabled) return;
  if (a === 'home') return go('');
  if (a === 'health') { S.err = ''; return go('health'); }
  if (a === 'scans') return go('scans');
  if (a === 'login') { S.login = { step: 'phone', role: 'patient', phone: '', busy: false, err: '' }; return go('login'); }
  if (a === 'logout') { logout(); return go(''); }
  if (a === 'tab') { S.tab = el.getAttribute('data-k'); S.focus = ''; return rerender(); }
  if (a === 'share') return sharePackage(id);
  if (a === 'more') { S.open[id] = !S.open[id]; return rerender(true); }
  if (a === 'back') { var bt = backTarget(); return bt ? go(bt) : go(''); }
  if (a === 'addpkcat') { S.adminTab = 'packages'; S.edit = null; S.pkCatEdit = { id: '', name: '', order: String(S.pkCats.length + 1), active: true, err: '', busy: false }; return go('admin'); }
  if (a === 'newpkcat') { S.pkCatEdit = { id: '', name: '', order: String(S.adminPkCats.length + 1), active: true, err: '', busy: false }; return rerender(); }
  if (a === 'editpkcat') { var pq = byId(S.adminPkCats, id); S.pkCatEdit = { id: pq.id, name: pq.name, order: String(pq.order), active: pq.active, err: '', busy: false }; return rerender(); }
  if (a === 'cancelpkcat') { S.pkCatEdit = null; return rerender(); }
  if (a === 'savepkcat') {
    var PE = S.pkCatEdit; if (PE.name.trim().length < 2) { PE.err = 'Please enter the category name.'; return rerender(true); }
    PE.busy = true; PE.err = ''; rerender(true);
    return savePkCat('adminSavePkCat', { id: PE.id, name: PE.name.trim(), order: PE.order, active: !!PE.active }, true);
  }
  if (a === 'togglepkcat') { var pt2 = byId(S.adminPkCats, id); return savePkCat('adminSavePkCat', { id: pt2.id, name: pt2.name, order: pt2.order, active: !pt2.active }, false); }
  if (a === 'delpkcat') {
    if (S.delArm !== id) { S.delArm = id; return drawPackages(); }
    S.delArm = ''; return savePkCat('adminDeletePkCat', { id: id }, false);
  }
  if (a === 'dcat') { S.dcat = id; S.dq = ''; S.dtype = ''; return rerender(); }
  if (a === 'dtype') { S.dtype = el.getAttribute('data-t'); return rerender(true); }
  if (a === 'tbasket') { var bi = S.basket.indexOf(id); if (bi >= 0) S.basket.splice(bi, 1); else S.basket.push(id); saveBasket(); return rerender(true); }
  if (a === 'tremove') { var bj = S.basket.indexOf(id); if (bj >= 0) S.basket.splice(bj, 1); saveBasket(); return rerender(true); }
  if (a === 'basket') { return go('basket'); }
  if (a === 'scans') { return go('scans'); }
  if (a === 'bookbasket') {
    if (!S.basket.length) return;
    S.pkgId = '__basket'; S.err = ''; S.sel.time = '';
    if (!S.token) { S.login = { step: 'phone', role: 'patient', phone: '', busy: false, err: '' }; return go('login'); }
    return startPatientStep();
  }
  if (a === 'adddiagcat') { S.adminTab = 'diag'; S.dCatEdit = { id: '', name: '', order: String(S.cats.length + 1), home: false, active: true, err: '', busy: false }; return go('admin'); }
  if (a === 'newdc') { S.dCatEdit = { id: '', name: '', order: String(S.adminDiag.cats.length + 1), home: false, active: true, err: '', busy: false }; return rerender(); }
  if (a === 'editdc') { var dq = byId(S.adminDiag.cats, id); S.dCatEdit = { id: dq.id, name: dq.name, order: String(dq.order), home: dq.home, active: dq.active, err: '', busy: false }; return rerender(); }
  if (a === 'canceldc') { S.dCatEdit = null; return rerender(); }
  if (a === 'savedc') {
    var DE = S.dCatEdit; if (DE.name.trim().length < 2) { DE.err = 'Please enter the category name.'; return rerender(true); }
    DE.busy = true; DE.err = ''; rerender(true);
    return saveDiag('adminSaveDiagCat', { id: DE.id, name: DE.name.trim(), order: DE.order, home: !!DE.home, active: !!DE.active }, 'dCatEdit');
  }
  if (a === 'toggledc') { var dt = byId(S.adminDiag.cats, id); return saveDiag('adminSaveDiagCat', { id: dt.id, name: dt.name, order: dt.order, home: dt.home, active: !dt.active }, null); }
  if (a === 'deldc') {
    if (S.delArm !== id) { S.delArm = id; return drawDiag(); }
    S.delArm = ''; return saveDiag('adminDeleteDiagCat', { id: id }, null);
  }
  if (a === 'newtest') { S.dEdit = { id: '', name: '', category: S.adminDcat, type: '', price: '', active: true, err: '', busy: false }; return rerender(); }
  if (a === 'edittest') { var tq = byId(S.adminDiag.tests, id); S.dEdit = { id: tq.id, name: tq.name, category: tq.category, type: tq.type || '', price: tq.price, active: tq.active, err: '', busy: false }; return rerender(); }
  if (a === 'canceltest') { S.dEdit = null; return rerender(); }
  if (a === 'savetest') {
    var TE = S.dEdit; if (TE.name.trim().length < 3) { TE.err = 'Please enter the test name.'; return rerender(true); }
    if (!(+TE.price > 0)) { TE.err = 'Please enter the price.'; return rerender(true); }
    TE.busy = true; TE.err = ''; rerender(true);
    return saveDiag('adminSaveTest', { id: TE.id, name: TE.name.trim(), category: TE.category, type: TE.type.trim(), price: TE.price, active: !!TE.active }, 'dEdit');
  }
  if (a === 'togglet') { var tt = byId(S.adminDiag.tests, id); return saveDiag('adminSaveTest', { id: tt.id, name: tt.name, category: tt.category, type: tt.type, price: tt.price, active: !tt.active }, null); }
  if (a === 'deltest') {
    if (S.delArm !== id) { S.delArm = id; return drawAdminTests(); }
    S.delArm = ''; return saveDiag('adminDeleteTest', { id: id }, null);
  }
  if (a === 'bulktest') { S.dBulk = { category: S.adminDcat, lines: '', msg: '', err: '', busy: false }; return rerender(); }
  if (a === 'cancelbulk') { S.dBulk = null; return rerender(); }
  if (a === 'savebulk') {
    var BE = S.dBulk; if (!BE.lines.trim()) { BE.err = 'Please paste at least one line.'; return rerender(true); }
    BE.busy = true; BE.err = ''; BE.msg = ''; rerender(true);
    return api('adminImportTests', { category: BE.category, lines: BE.lines }).then(function (r) {
      S.adminDiag = { cats: r.cats, tests: r.tests }; BE.busy = false; BE.lines = ''; BE.msg = r.added + ' tests added' + (r.skipped ? ', ' + r.skipped + ' lines skipped (need Name | Price)' : '') + '.'; rerender(true); reloadConfig();
    }).catch(function (er) { BE.busy = false; BE.err = er.message; rerender(true); });
  }
  if (a === 'booknow') {
    S.pkgId = id; S.err = ''; S.sel.time = '';
    if (!S.token) { S.login = { step: 'phone', role: 'patient', phone: '', busy: false, err: '' }; return go('login'); }
    return startPatientStep();
  }
  if (a === 'selpt') { if (e.target.closest('button')) return; S.patientId = id; S.err = ''; return rerender(true); }
  if (a === 'addpt') { S.pf = { mode: 'form', id: '', name: '', age: '', gender: '', relation: S.patients.length ? 'Spouse' : 'Myself', err: '', busy: false }; return rerender(); }
  if (a === 'editpt') { var p = byId(S.patients, id); S.pf = { mode: 'form', id: id, name: p.name, age: String(p.age), gender: p.gender.toLowerCase(), relation: p.relation || 'Other', err: '', busy: false }; return rerender(); }
  if (a === 'cancelpt') { S.pf.mode = 'list'; return rerender(); }
  if (a === 'delpt') {
    if (S.delArm !== id) { S.delArm = id; return rerender(true); }
    S.delArm = '';
    return api('deletePatient', { id: id }).then(function (r) { S.patients = r.patients; if (S.patientId === id) S.patientId = ''; rerender(true); }).catch(function (er) { S.err = er.message; rerender(true); });
  }
  if (a === 'savept') {
    var F = S.pf, name = F.name.trim(), age = parseInt(F.age, 10);
    if (name.length < 2) { F.err = 'Please enter the name.'; return rerender(true); }
    if (!(age >= 1 && age <= 110)) { F.err = 'Please enter an age between 1 and 110.'; return rerender(true); }
    if (!F.gender) { F.err = 'Please choose the gender.'; return rerender(true); }
    F.busy = true; F.err = ''; rerender(true);
    return api('savePatient', { id: F.id, name: name, age: age, gender: F.gender, relation: F.relation }).then(function (r) {
      S.patients = r.patients; S.patientId = r.id; S.pf = { mode: 'list', id: '', name: '', age: '', gender: '', relation: 'Spouse', err: '', busy: false }; rerender();
    }).catch(function (er) { F.busy = false; F.err = er.message; rerender(true); });
  }
  if (a === 'topatient') { S.sel.time = ''; S.err = ''; return go('visit'); }
  if (a === 'visit') { sel.visit = el.getAttribute('data-v'); sel.time = ''; S.err = ''; return refresh(); }
  if (a === 'date') { sel.date = el.getAttribute('data-d'); sel.time = ''; S.err = ''; return refresh(); }
  if (a === 'time') { sel.time = el.getAttribute('data-t'); S.err = ''; return rerender(true); }
  if (a === 'confirm') return confirmBooking();
  if (a === 'gotoadmin') { S.adminTab = S.admin ? 'packages' : 'bookings'; S.edit = null; S.editLc = null; return go('admin'); }
  if (a === 'changephone') { S.login.step = 'phone'; S.login.err = ''; return rerender(); }
  if (a === 'sendotp' || a === 'resend') {
    var L = S.login;
    if (a === 'sendotp') {
      var ph = cleanPhone(($('ph') || {}).value || L.phone);
      if (!ph) { L.err = 'Please enter a valid 10-digit mobile number.'; return rerender(); }
      L.phone = ph;
    }
    L.busy = true; L.err = ''; rerender();
    return api('sendOtp', { phone: L.phone, website: ($('hp') || {}).value || '' }).then(function () { L.busy = false; L.step = 'code'; rerender(); })
      .catch(function (er) { L.busy = false; L.err = er.message; rerender(); });
  }
  if (a === 'verify') {
    var L2 = S.login, code = (($('otp') || {}).value || '').replace(/\D/g, '');
    if (code.length !== 6) { L2.err = 'Please enter the 6-digit code.'; return rerender(); }
    L2.busy = true; L2.err = ''; rerender();
    return api('verifyOtp', { phone: L2.phone, code: code }).then(function (r) {
      L2.busy = false; S.token = r.token; S.role = r.role; S.admin = !!r.admin; S.staff = !!r.staff; S.phone = r.phone; S.patients = r.patients || []; S.patientId = ''; saveSession(); afterLogin();
    }).catch(function (er) { L2.busy = false; L2.err = er.message; rerender(); });
  }
  if (a === 'atab') { S.adminTab = el.getAttribute('data-t'); S.edit = null; S.editLc = null; S.dCatEdit = null; S.dEdit = null; S.dBulk = null; S.pkCatEdit = null; S.delArm = ''; return rerender(); }
  if (a === 'arange') { S.adminRange = el.getAttribute('data-r'); return rerender(); }
  if (a === 'newlc') { S.editLc = { id: '', name: '', address: '', phone: '', opens: '06:00', closes: '17:00', capacity: '3', clinic: true, home: false, active: true, err: '', busy: false }; return rerender(); }
  if (a === 'editlc') { var lq = byId(S.adminLc, id); S.editLc = { id: lq.id, name: lq.name, address: lq.address, phone: lq.phone, opens: lq.opens, closes: lq.closes, capacity: String(lq.capacity), clinic: lq.clinic, home: lq.home, active: lq.active, err: '', busy: false }; return rerender(); }
  if (a === 'cancellc') { S.editLc = null; return rerender(); }
  if (a === 'togglelc') { var lt = byId(S.adminLc, id); return saveLocation({ id: lt.id, name: lt.name, address: lt.address, phone: lt.phone, opens: lt.opens, closes: lt.closes, capacity: lt.capacity, clinic: lt.clinic, home: lt.home, active: !lt.active }); }
  if (a === 'dellc') {
    if (S.delArm !== id) { S.delArm = id; return drawLocations(); }
    S.delArm = '';
    return api('adminDeleteLocation', { id: id }).then(function (r) { S.adminLc = r.locations; drawLocations(); reloadConfig(); }).catch(adminErr);
  }
  if (a === 'savelc') {
    var LE = S.editLc;
    if (LE.name.trim().length < 3) { LE.err = 'Please enter the location name.'; return rerender(true); }
    if (LE.address.trim().length < 5) { LE.err = 'Please enter the address.'; return rerender(true); }
    if (!LE.phone.trim()) { LE.err = 'Please enter the contact number.'; return rerender(true); }
    if (!LE.opens || !LE.closes || LE.opens >= LE.closes) { LE.err = 'Opening time must be earlier than closing time.'; return rerender(true); }
    if (!LE.clinic && !LE.home) { LE.err = 'Choose at least one: centre visit or home collection.'; return rerender(true); }
    LE.busy = true; LE.err = ''; rerender(true);
    return saveLocation(LE);
  }
  if (a === 'newpk') { S.edit = { id: '', name: '', category: S.tab, subtitle: '', oldPrice: '', price: '', member: '', tests: '', fasting: '0', order: '', home: true, premium: false, top: false, active: true, err: '', busy: false }; return rerender(); }
  if (a === 'editpk') { var q = byId(S.adminPk, id); S.edit = { id: q.id, name: q.name, category: q.category, subtitle: q.subtitle, oldPrice: q.oldPrice || '', price: q.price, member: q.member || '', tests: q.tests.join('\n'), fasting: String(q.fasting), order: q.order, home: q.home, premium: q.premium, top: q.top, active: q.active, err: '', busy: false }; return rerender(); }
  if (a === 'cancelpk') { S.edit = null; return rerender(); }
  if (a === 'togglepk') { var t = byId(S.adminPk, id); return savePackage({ id: t.id, name: t.name, category: t.category, subtitle: t.subtitle, oldPrice: t.oldPrice, price: t.price, member: t.member, tests: t.tests.join('\n'), fasting: t.fasting, order: t.order, home: t.home, premium: t.premium, top: t.top, active: !t.active }, true); }
  if (a === 'delpk') {
    if (S.delArm !== id) { S.delArm = id; return drawPackages(); }
    S.delArm = '';
    return api('adminDeletePackage', { id: id }).then(function (r) { S.adminPk = r.packages.map(normPk); drawPackages(); reloadConfig(); }).catch(adminErr);
  }
  if (a === 'savepk') {
    var E = S.edit;
    if (E.name.trim().length < 3) { E.err = 'Please enter the package name.'; return rerender(true); }
    if (!(+E.price > 0)) { E.err = 'Please enter the offer price.'; return rerender(true); }
    if (E.oldPrice && +E.oldPrice < +E.price) { E.err = 'The old price should not be lower than the offer price.'; return rerender(true); }
    if (!E.tests.trim()) { E.err = 'Please add at least one test.'; return rerender(true); }
    E.busy = true; E.err = ''; rerender(true);
    return savePackage(E, false);
  }
});
function savePackage(E, quick) {
  return api('adminSavePackage', { id: E.id, name: E.name.trim(), category: E.category, subtitle: E.subtitle, oldPrice: E.oldPrice, price: E.price, member: E.member, tests: E.tests, fasting: E.fasting, order: E.order, home: !!E.home, premium: !!E.premium, top: !!E.top, active: !!E.active })
    .then(function (r) { S.adminPk = r.packages.map(normPk); S.edit = null; rerender(true); reloadConfig(); })
    .catch(function (er) { if (S.edit) { S.edit.busy = false; S.edit.err = er.message; rerender(true); } else adminErr(er); });
}
function reloadConfig() { api('config').then(applyConfig).catch(function () {}); }

document.addEventListener('change', function (e) {
  var el = e.target, a = el.getAttribute('data-act'), k = el.getAttribute('data-in');
  if (a === 'loc') { S.sel.loc = el.value; S.sel.time = ''; S.sel.visit = 'clinic'; return refresh(); }
  if (a === 'astatus') return api('adminStatus', { id: el.getAttribute('data-id'), status: el.value }).catch(adminErr);
  if (k === 'pgender') S.pf.gender = el.value;
  if (k === 'prel') S.pf.relation = el.value;
  if (k === 'e.category') S.edit.category = el.value;
  if (k === 'acat') { S.adminDcat = el.value; S.aq = ''; return drawDiag(); }
  if (k === 'dc.home') S.dCatEdit.home = el.checked;
  if (k === 'pc.active') S.pkCatEdit.active = el.checked;
  if (k === 'dc.active') S.dCatEdit.active = el.checked;
  if (k === 't.category') { S.dEdit.category = el.value; return testForm(); }
  if (k === 't.active') S.dEdit.active = el.checked;
  if (k === 'b.category') S.dBulk.category = el.value;
  if (/^l\.(clinic|home|active)$/.test(k)) S.editLc[k.slice(2)] = el.checked;
  if (k === 'e.home') S.edit.home = el.checked;
  if (k === 'e.premium') S.edit.premium = el.checked;
  if (k === 'e.top') S.edit.top = el.checked;
  if (k === 'e.active') S.edit.active = el.checked;
});
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute('data-in'); if (!k) return;
  var v = e.target.value;
  if (k === 'address') { S.sel.address = v; var btn = document.querySelector('[data-act="confirm"]'); if (btn) btn.disabled = !(curLoc() && S.sel.time && v.trim().length >= 8); }
  if (k === 'lphone') S.login.phone = v;
  if (k === 'dq') { S.dq = v; drawDlist(); }
  if (k === 'pc.name' || k === 'pc.order') S.pkCatEdit[k.slice(3)] = v;
  if (k === 'aq') { S.aq = v; drawAdminTests(); }
  if (k === 'dc.name' || k === 'dc.order') S.dCatEdit[k.slice(3)] = v;
  if (/^t\.(name|price|type)$/.test(k)) S.dEdit[k.slice(2)] = v;
  if (k === 'b.lines') S.dBulk.lines = v;
  if (k === 'pname') S.pf.name = v;
  if (k === 'page') S.pf.age = v;
  if (/^l\.(name|address|phone|opens|closes|capacity)$/.test(k)) S.editLc[k.slice(2)] = v;
  if (/^e\.(name|subtitle|oldPrice|price|member|tests|fasting|order)$/.test(k)) S.edit[k.slice(2)] = v;
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var id = e.target.id;
  if (id === 'ph') { e.preventDefault(); document.querySelector('[data-act="sendotp"]').click(); }
  if (id === 'otp') { e.preventDefault(); document.querySelector('[data-act="verify"]').click(); }
});
window.addEventListener('hashchange', route);

/* ---------- start ---------- */
(function init() {
  try { S.basket = JSON.parse(load('ad_basket') || '[]') || []; } catch (e) { S.basket = []; }
  try { var ss = JSON.parse(load('ad_session') || 'null'); if (ss && ss.token) { S.token = ss.token; S.role = ss.role; S.admin = !!ss.admin; S.staff = !!ss.staff; S.phone = ss.phone; } } catch (e) {}
  route();
  api('config').then(function (r) {
    applyConfig(r);
    if (r.settings) SETTINGS = Object.assign(SETTINGS, r.settings);
    route();
    if (S.token) api('me').then(function (m) { S.patients = m.patients || []; S.admin = !!m.admin; S.staff = !!m.staff; header(); if (curRoute() === 'patient') route(); }).catch(function (e) { if (e.code === 'auth') { logout(); route(); } });
  }).catch(function () { S.loadErr = true; route(); });
})();
</script>
</body>
</html>
